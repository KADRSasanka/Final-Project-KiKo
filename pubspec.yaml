name: kiko
description: KiKo - a playful learning app for kids aged 8-12.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  # Packages below are added with `flutter pub add` (see setup steps):
  # flutter_riverpod, go_router, firebase_core, google_fonts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/avatars/
    - assets/animations/
    - assets/audio/
    - assets/content/
